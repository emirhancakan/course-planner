name: Update course data

on:
  schedule:
    # 03:00 UTC = 06:00 Istanbul. GitHub may delay scheduled runs under load.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semester to scrape, e.g. 2026/2027-1 (leave blank for the newest plus the current one)'
        required: false
        default: ""

permissions:
  contents: write   # commit and push the refreshed dataset
  pages: write      # ask Pages to rebuild (see the trigger step below)

concurrency:
  group: update-courses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # up to two semesters, each with retry rounds

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape, check and commit
        id: update
        env:
          # Blank for a scheduled run: the newest semester plus the newest one
          # already published (see scraper/run_update.sh).
          SEMESTER: ${{ inputs.semester }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scraper/run_update.sh

      - name: Trigger the Pages build
        # This repo deploys Pages from the main branch (legacy build type), and a
        # push made with GITHUB_TOKEN does not reliably start that build. Asking
        # for it explicitly keeps the live site in step with the data.
        # always(): one semester failing must not hold back the Pages build for
        # another that was committed.
        if: always() && steps.update.outputs.committed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
