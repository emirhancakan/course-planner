name: Update course data

on:
  schedule:
    # 03:00 UTC = 06:00 Istanbul. GitHub may delay scheduled runs under load.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      semester:
        description: 'Semester to scrape, e.g. 2026/2027-1 (leave blank for the newest)'
        required: false
        default: ""

permissions:
  contents: write   # commit and push the refreshed dataset
  pages: write      # ask Pages to rebuild (see the trigger step below)

concurrency:
  group: update-courses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape the registrar
        env:
          SEMESTER: ${{ inputs.semester }}
        run: |
          if [ -n "$SEMESTER" ]; then
            python scraper/scrape_boun.py "$SEMESTER"
          else
            python scraper/scrape_boun.py
          fi

      - name: Check integrity and detect changes
        id: diff
        env:
          SEMESTER: ${{ inputs.semester }}
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit_message.txt
        run: |
          if [ -n "$SEMESTER" ]; then
            python scraper/detect_changes.py "$SEMESTER"
          else
            python scraper/detect_changes.py
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit_message.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -F "$COMMIT_MESSAGE_FILE"
          git push

      - name: Trigger the Pages build
        # This repo deploys Pages from the main branch (legacy build type), and a
        # push made with GITHUB_TOKEN does not reliably start that build. Asking
        # for it explicitly keeps the live site in step with the data.
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      - name: Report
        if: always()
        run: |
          {
            echo "### Course data update"
            echo ""
            if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
              echo "Committed an update for \`${{ steps.diff.outputs.semester }}\`."
              echo ""
              echo '```'
              cat "${{ runner.temp }}/commit_message.txt"
              echo '```'
            elif [ "${{ steps.diff.outputs.changed }}" = "false" ]; then
              echo "No course changes for \`${{ steps.diff.outputs.semester }}\` - nothing committed."
            else
              echo "The run did not reach the comparison step; see the logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
