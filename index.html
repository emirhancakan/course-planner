<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUN Course Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>Course Planner</h1>
  <div class="semester-picker">
    <label for="semesterSelect">Semester</label>
    <select id="semesterSelect"></select>
  </div>
  <div class="summary" id="summary"></div>
</header>

<main class="app-main">
  <aside class="sidebar">
    <section class="panel selected-panel" data-scrollview>
      <h2>My Courses</h2>
      <div class="selected-list" id="selectedList"></div>
    </section>

    <section class="panel search-panel">
      <div class="search-bar">
        <input type="text" id="searchInput" autocomplete="off" placeholder="Course code or name — add a space to pin the code (e.g. &quot;CE &quot; = CE only)">
      </div>
      <!-- The scroller lives on the wrapper, not on #results: app.js replaces
           the innerHTML of #results on every render, which would destroy the
           scrollbar that scrollview.js puts inside it. -->
      <div class="results-scroll" data-scrollview>
        <div class="results" id="results"></div>
      </div>
    </section>
  </aside>

  <section class="panel schedule-panel">
    <div class="grid-wrap">
      <table class="grid" id="grid"></table>
    </div>
    <div class="conflicts" id="conflicts"></div>
  </section>
</main>

<script src="data/manifest.js"></script>
<script src="scrollview.js"></script>
<script src="app.js"></script>
</body>
</html>
